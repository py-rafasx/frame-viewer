<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Editorial Gallery — Mobile</title>
    <link rel="icon" href="../../static/chibi-frieren.jpeg">
    <style>
        :root {
            --bg: #f5f5f4;
            --surface: #ffffff;
            --ink: #18181b;
            --muted: #71717a;
            --line: #e4e4e7;
            --line-strong: #d4d4d8;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100dvh; overflow: hidden; position: fixed; inset: 0;
            background: var(--bg);
            background-image: url('../../static/fundo.jpg');
            background-size: cover; background-position: center;
            color: var(--ink);
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            user-select: none;
        }
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 0;
            background: rgba(245,245,244,0.9); backdrop-filter: blur(4px);
        }
        .app {
            position: relative; z-index: 1; height: 100%;
            display: flex; flex-direction: column; gap: 8px;
            padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
        }
        .card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 1px 6px rgba(0,0,0,0.04); }

        /* ---- top ---- */
        .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; }
        .wordmark { font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
        .wordmark i { font-style: normal; color: var(--muted); }
        .top select {
            font-family: inherit; font-size: 13px; font-weight: 600; color: var(--ink);
            background: var(--surface); border: 1px solid var(--line-strong);
            border-radius: 8px; padding: 8px 10px; max-width: 38%; cursor: pointer;
        }
        select:focus { outline: none; border-color: var(--ink); }

        /* ---- caption strip (frame + timestamp) ---- */
        .strip {
            display: flex; gap: 8px; padding: 10px 14px; align-items: center; justify-content: space-between;
        }
        .strip .pos { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
        .strip .pos small { font-size: 12px; color: var(--muted); font-weight: 500; }
        .strip .ts {
            font-size: 12px; font-weight: 600; color: var(--muted);
            font-variant-numeric: tabular-nums; letter-spacing: .4px;
            border: 1px solid var(--line-strong); border-radius: 30px; padding: 6px 12px;
            background: var(--bg);
        }
        .strip .mini { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        #frame-input {
            width: 58px; text-align: center; border: none; border-bottom: 1.5px solid var(--line-strong);
            background: transparent; font-family: inherit; font-size: 20px; font-weight: 700;
            color: var(--ink); outline: none; border-radius: 0;
            font-variant-numeric: tabular-nums; padding: 0;
        }
        #frame-input:focus { border-bottom-color: var(--ink); }
        #frame-input::-webkit-inner-spin-button, #frame-input::-webkit-outer-spin-button { -webkit-appearance: none; }
        #timestamp-btn { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }

        /* ---- stage ---- */
        .stage {
            position: relative; flex: 1; min-height: 0; border-radius: 3px; overflow: hidden;
            background: #000; display: flex; align-items: center; justify-content: center;
        }
        .stage img { width: 100%; height: 100%; object-fit: contain; }
        #err-msg-view {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 82%; max-width: 320px; display: none;
            background: #fff; border: 1px solid var(--line); border-radius: 4px;
            padding: 16px; text-align: center; color: #b91c1c; font-weight: 600;
            font-size: 13px; z-index: 3; box-shadow: 0 14px 34px rgba(0,0,0,0.18);
        }
        .spinner {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #fff; border-radius: 50%;
            animation: spin .9s linear infinite; z-index: 2; display: none;
        }
        @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

        /* ---- bottom ---- */
        .bottom { display: flex; flex-direction: column; gap: 8px; }
        .progress { padding: 10px 14px 6px; display: flex; flex-direction: column; gap: 3px; }
        .time-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
        #progress-bar {
            width: 100%; height: 3px; border-radius: 2px; background: var(--line-strong);
            -webkit-appearance: none; appearance: none; outline: none; cursor: pointer;
            touch-action: manipulation;
        }
        #progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
            background: var(--ink); border: 6px solid #fff; margin-top: -8.5px;
            box-shadow: 0 0 0 1px var(--line-strong), 0 2px 6px rgba(0,0,0,0.12);
        }
        #progress-bar::-moz-range-thumb {
            width: 8px; height: 20px; border: none; border-radius: 4px;
            background: var(--ink); border: 6px solid #fff;
            box-shadow: 0 0 0 1px var(--line-strong), 0 2px 6px rgba(0,0,0,0.12);
        }
        #progress-bar::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: var(--line-strong); }
        #progress-bar::-moz-range-track { height: 3px; border-radius: 2px; background: var(--line-strong); border: none; }

        .nav {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px;
        }
        .nav button {
            -webkit-appearance: none; appearance: none; cursor: pointer;
            height: 46px; border-radius: 30px; border: 1px solid var(--line-strong);
            background: var(--surface); color: var(--ink);
            display: flex; align-items: center; justify-content: center;
            font-family: inherit; font-size: 12px; font-weight: 600; gap: 4px;
            transition: transform .12s, background .2s; min-width: 44px;
        }
        .nav button svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .nav button:active { transform: scale(0.94); }
        .nav button.solid { background: var(--ink); border-color: var(--ink); color: #fff; }
        .nav button:not(.solid) .no-label { display: none; }
    </style>
</head>
<body>
    <div class="app">
        <header class="top card">
            <span class="wordmark">Frieren<i>.Frames</i></span>
            <select id="season-list"><option value="" disabled selected>Season</option></select>
            <select id="episode-list"><option value="" disabled selected>Episode</option></select>
        </header>

        <div class="strip card">
            <div class="pos">
                <span id="frame-current">—</span><small id="frame-total"> / —</small>
            </div>
            <div class="mini">
                <div class="ts">Frame</div>
                <input type="number" id="frame-input" value="1" data-min="1" inputmode="numeric">
            </div>
            <div id="timestamp-btn">0:00:00.00</div>
        </div>

        <main class="stage">
            <img id="current-image" src="" alt="Frame">
            <div id="err-msg-view"></div>
            <div class="spinner"></div>
        </main>

        <div class="bottom">
            <div class="progress card">
                <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.01">
                <div class="time-row">
                    <span id="current-time">0:00:00.00</span>
                    <span id="total-time">0:00:00.00</span>
                </div>
            </div>
            <nav class="nav card">
                <button id="prev-btn" aria-label="Previous frame">
                    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <button id="random-btn" aria-label="Random frame">
                    <span class="no-label">Rnd</span>
                    <svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
                </button>
                <button id="download-btn" aria-label="Download frame">
                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </button>
                <button class="solid" id="next-btn" aria-label="Next frame">
                    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
            </nav>
        </div>
    </div>

    <script src="../../mobile/main.js"></script>
    <script>
        // Preenche o contador grande de frame na legenda
        const frameCur = document.getElementById('frame-current');
        const frameTot = document.getElementById('frame-total');
        const origSetTimestamp = set_timestamp;
        set_timestamp = function () {
            origSetTimestamp();
            if (global_frame != null && seasons[global_season] && seasons[global_season].episodes[global_episode]) {
                frameCur.textContent = global_frame;
                frameTot.textContent = ' / ' + seasons[global_season].episodes[global_episode].frames;
            }
        };
    </script>
</body>
</html>
