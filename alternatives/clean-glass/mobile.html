<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Clean Glass — Mobile</title>
    <link rel="icon" href="../../static/chibi-frieren.jpeg">
    <style>
        :root {
            --glass: rgba(255,255,255,0.62);
            --glass-strong: rgba(255,255,255,0.85);
            --stroke: rgba(255,255,255,0.8);
            --text: #1e293b;
            --muted: #64748b;
            --accent: #2563eb;
            --accent2: #7c3aed;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100dvh; overflow: hidden; position: fixed; inset: 0;
            background:
                radial-gradient(600px 400px at 90% -10%, rgba(124,58,237,0.22), transparent 60%),
                radial-gradient(500px 400px at -10% 105%, rgba(37,99,235,0.20), transparent 55%),
                linear-gradient(160deg, #dfe9f3, #eceaf7);
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            user-select: none;
        }
        .bg {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: url('../../static/fundo.jpg') center/cover no-repeat;
            opacity: .08; filter: blur(16px);
        }
        .app {
            position: relative; z-index: 1; height: 100%;
            display: flex; flex-direction: column; gap: 8px;
            padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
        }

        .panel {
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid var(--stroke);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(30,41,59,0.10), inset 0 1px 0 rgba(255,255,255,0.7);
        }

        /* ---- header ---- */
        .head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
        .head .logo { width: 28px; height: 28px; border-radius: 9px; box-shadow: 0 3px 8px rgba(37,99,235,0.25); }
        .head h1 { font-size: 14px; font-weight: 800; letter-spacing: -.2px; flex: 1; white-space: nowrap; }
        .head select {
            font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text);
            background: var(--glass-strong); border: 1.5px solid rgba(30,41,59,0.08);
            border-radius: 11px; padding: 8px 10px; max-width: 40%; cursor: pointer;
        }
        select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }

        /* ---- frame / timestamp ---- */
        .meta { display: flex; gap: 8px; padding: 10px; }
        .meta .cell { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; }
        .meta label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
        #frame-input {
            width: 100%; text-align: center; border: none; background: transparent; outline: none;
            font-family: inherit; font-size: clamp(20px, 6vw, 26px); font-weight: 800;
            color: var(--text); font-variant-numeric: tabular-nums;
        }
        #frame-input::-webkit-inner-spin-button, #frame-input::-webkit-outer-spin-button { -webkit-appearance: none; }
        #timestamp-btn {
            width: 100%; text-align: center; font-size: clamp(15px, 4.5vw, 18px);
            font-weight: 700; color: var(--accent2); font-variant-numeric: tabular-nums;
        }

        /* ---- stage ---- */
        .stage {
            flex: 1; min-height: 0; position: relative; border-radius: 16px; overflow: hidden;
            background: #101522; display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--stroke);
            box-shadow: 0 16px 40px rgba(30,41,59,0.25);
        }
        .stage img { width: 100%; height: 100%; object-fit: contain; }
        #err-msg-view {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 82%; max-width: 320px; display: none;
            background: rgba(255,255,255,0.97); border-radius: 12px; padding: 16px;
            text-align: center; color: #dc2626; font-weight: 600; font-size: 13px; z-index: 3;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        }
        .spinner {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #fff; border-radius: 50%;
            animation: spin .9s linear infinite; z-index: 2; display: none;
        }
        @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

        /* ---- progress ---- */
        .progress { padding: 12px 14px 8px; display: flex; flex-direction: column; gap: 2px; }
        #progress-bar {
            width: 100%; height: 7px; border-radius: 4px; background: rgba(30,41,59,0.12);
            -webkit-appearance: none; appearance: none; outline: none; cursor: pointer;
            touch-action: manipulation;
        }
        #progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: 2.5px solid #fff; margin-top: -5.5px;
            box-shadow: 0 2px 8px rgba(37,99,235,0.4);
        }
        #progress-bar::-moz-range-thumb {
            width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
        }
        #progress-bar::-webkit-slider-runnable-track { height: 7px; border-radius: 4px; background: rgba(30,41,59,0.12); }
        #progress-bar::-moz-range-track { height: 7px; border-radius: 4px; background: rgba(30,41,59,0.12); border: none; }
        .time-row { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }

        /* ---- nav ---- */
        .nav {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px;
        }
        .nav button {
            -webkit-appearance: none; appearance: none; border: none; cursor: pointer;
            height: 52px; border-radius: 13px;
            background: var(--glass-strong); border: 1.5px solid rgba(30,41,59,0.08);
            display: flex; align-items: center; justify-content: center;
            transition: transform .15s, box-shadow .2s; min-width: 44px;
        }
        .nav button:active { transform: scale(0.92); }
        .nav button svg { width: 21px; height: 21px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .nav button.accent {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-color: transparent; box-shadow: 0 6px 16px rgba(37,99,235,0.35);
        }
        .nav button.accent svg { stroke: #fff; }
    </style>
</head>
<body>
    <div class="bg"></div>

    <div class="app">
        <header class="head panel">
            <img class="logo" src="../../static/chibi-frieren.jpeg" alt="Frieren">
            <h1>Frieren · Frames</h1>
            <select id="season-list"><option value="" disabled selected>Season</option></select>
            <select id="episode-list"><option value="" disabled selected>Episode</option></select>
        </header>

        <div class="meta panel">
            <div class="cell">
                <label for="frame-input">Frame</label>
                <input type="number" id="frame-input" placeholder="1234" data-min="1">
            </div>
            <div class="cell">
                <label>Timestamp</label>
                <div id="timestamp-btn">0:00:00.00</div>
            </div>
        </div>

        <main class="stage">
            <img id="current-image" src="" alt="Frame">
            <div id="err-msg-view"></div>
            <div class="spinner"></div>
        </main>

        <div class="progress panel">
            <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.01">
            <div class="time-row">
                <span id="current-time">0:00:00.00</span>
                <span id="total-time">0:00:00.00</span>
            </div>
        </div>

        <nav class="nav panel">
            <button id="prev-btn" aria-label="Previous frame">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <button id="random-btn" aria-label="Random frame">
                <svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
            </button>
            <button class="accent" id="download-btn" aria-label="Download frame">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>
            <button id="next-btn" aria-label="Next frame">
                <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </nav>
    </div>

    <script src="../../mobile/main.js"></script>
</body>
</html>
