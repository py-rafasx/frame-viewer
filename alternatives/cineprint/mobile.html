<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cineprint — Mobile</title>
    <link rel="icon" href="../../static/chibi-frieren.jpeg">
    <style>
        :root {
            --bg: #12100c;
            --panel: #1a1712;
            --panel-2: #221e17;
            --ink: #e8e0ce;
            --muted: #94896f;
            --line: #2b251c;
            --line-strong: #3b3325;
            --amber: #d8bd7f;
            --red: #b3402e;
            --mono: ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace;
            --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: var(--sans); color: var(--ink);
            height: 100dvh; overflow: hidden; position: fixed; inset: 0;
            background: var(--bg);
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none; user-select: none;
        }
        .app {
            height: 100%; display: flex; flex-direction: column; gap: 8px;
            padding: calc(8px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));
        }

        .top {
            display: flex; align-items: center; justify-content: space-between; gap: 6px;
            padding: 10px 4px; border-bottom: 1px solid var(--line);
        }
        .edge { font-family: var(--mono); font-size: 12px; letter-spacing: 2px; font-weight: 700; white-space: nowrap; }
        .edge .dot { color: var(--red); }
        .top select {
            appearance: none; -webkit-appearance: none; font-family: var(--mono);
            font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--ink);
            background: var(--panel) url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2394896f' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right 9px center;
            border: 1px solid var(--line-strong); border-radius: 2px;
            padding: 8px 24px 8px 11px; cursor: pointer; max-width: 40%;
        }
        select:focus { outline: none; border-color: var(--amber); }

        /* ---- film ---- */
        .film { background: var(--panel); border: 1px solid var(--line); padding: 0 6px; flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .sprockets {
            height: 16px; flex-shrink: 0;
            background-color: var(--panel-2);
            background-image: radial-gradient(circle, #0c0a07 2.6px, transparent 3.2px);
            background-size: 26px 16px; background-position: 0 60%; background-repeat: repeat-x;
            position: relative;
        }
        .sprockets.top { border-bottom: 1px solid var(--line-strong); }
        .sprockets.bottom { border-top: 1px solid var(--line-strong); }
        .edge-text {
            position: absolute; right: 6px;
            font-family: var(--mono); font-size: 8.5px; letter-spacing: 1.5px; color: var(--muted);
            background: var(--panel-2); padding: 0 5px; top: 1px;
        }
        .sprockets.bottom .edge-text { top: auto; bottom: 1px; }

        .stage {
            position: relative; flex: 1; min-height: 0; background: #080705;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .stage img { width: 100%; height: 100%; object-fit: contain; }
        .stage::after { content: ''; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 60px rgba(0,0,0,0.5); }
        #err-msg-view {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 82%; max-width: 320px; display: none;
            background: #201a12; border: 1px solid #4c3f28; border-radius: 2px;
            padding: 14px; text-align: center; color: #e4b860; font-weight: 600; font-size: 12px; z-index: 3;
            font-family: var(--mono); letter-spacing: .5px;
        }
        .spinner {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.12);
            border-top-color: var(--amber); border-radius: 50%;
            animation: spin .9s linear infinite; z-index: 2; display: none;
        }
        @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

        /* ---- meta ---- */
        .meta { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 4px; font-family: var(--mono); }
        .tc { font-size: clamp(17px, 5vw, 22px); letter-spacing: 1.5px; color: var(--amber); font-weight: 700; font-variant-numeric: tabular-nums; }
        .tc .rec { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-right: 7px; animation: blink 1.4s steps(1) infinite; }
        @keyframes blink { 50% { opacity: .25; } }
        .frame-no { font-size: 11px; letter-spacing: 1.5px; color: var(--muted); }
        .frame-no b { color: var(--ink); font-variant-numeric: tabular-nums; }

        /* ---- controls ---- */
        .deck { display: flex; flex-direction: column; gap: 8px; }
        .progress-row { display: flex; align-items: center; gap: 10px; }
        .progress-row time { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; font-family: var(--mono); min-width: 72px; }
        .progress-row time:first-child { text-align: right; }
        #progress-bar {
            flex: 1; height: 4px; border-radius: 2px; background: var(--line-strong);
            -webkit-appearance: none; appearance: none; outline: none; cursor: pointer; touch-action: manipulation;
        }
        #progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none; width: 13px; height: 20px; border-radius: 2px;
            background: var(--amber); margin-top: -8px; box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        #progress-bar::-moz-range-thumb {
            width: 11px; height: 20px; border: none; border-radius: 2px; background: var(--amber);
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        #progress-bar::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--line-strong); }
        #progress-bar::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line-strong); border: none; }

        /* frame + timestamp pill */
        .pill {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding: 5px 6px 5px 12px;
        }
        .pill label { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: 2px; }
        #frame-input {
            width: 62px; text-align: center; border: 1px solid var(--line-strong); background: var(--panel-2);
            color: var(--amber); font-family: var(--mono); font-size: 13px; font-weight: 700;
            border-radius: 2px; padding: 7px 0; outline: none; font-variant-numeric: tabular-nums;
        }
        #frame-input:focus { border-color: var(--amber); }
        #frame-input::-webkit-inner-spin-button, #frame-input::-webkit-outer-spin-button { -webkit-appearance: none; }
        #timestamp-btn {
            font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 1px;
            color: var(--muted); border: 1px solid var(--line-strong); border-radius: 2px;
            padding: 7px 10px; background: var(--panel);
        }

        .nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .nav button {
            -webkit-appearance: none; appearance: none; cursor: pointer;
            height: 46px; border-radius: 2px; border: 1px solid var(--line-strong);
            background: var(--panel); color: var(--ink);
            display: flex; align-items: center; justify-content: center; gap: 4px;
            font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 1px;
            transition: border-color .2s, transform .12s; min-width: 44px;
        }
        .nav button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .nav button:hover { border-color: var(--amber); }
        .nav button:active { transform: scale(0.94); }
        .nav button.solid { background: var(--amber); border-color: var(--amber); color: #1a1408; font-weight: 700; }
    </style>
</head>
<body>
    <div class="app">
        <header class="top">
            <span class="edge"><span class="dot">●</span> FRAME·VIEW</span>
            <select id="season-list"><option value="" disabled selected>Season</option></select>
            <select id="episode-list"><option value="" disabled selected>Episode</option></select>
        </header>

        <figure class="film">
            <div class="sprockets top"><span class="edge-text">FRAME <span id="edge-label">000001</span></span></div>
            <div class="stage">
                <img id="current-image" src="" alt="Frame">
                <div id="err-msg-view"></div>
                <div class="spinner"></div>
            </div>
            <div class="sprockets bottom"><span class="edge-text">S<span id="edge-s">-</span> EP<span id="edge-e">-</span></span></div>
        </figure>

        <div class="meta">
            <span class="tc"><span class="rec"></span><span id="timestamp-btn">0:00:00.00</span></span>
            <span class="frame-no">FRAME <b id="frame-label">—</b>/<span id="frame-total-label">—</span></span>
        </div>

        <div class="deck">
            <div class="progress-row">
                <time id="current-time">0:00:00.00</time>
                <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.01">
                <time id="total-time">0:00:00.00</time>
            </div>
            <div class="pill">
                <label for="frame-input">FRAME</label>
                <input type="number" id="frame-input" placeholder="1234" data-min="1">
            </div>
            <nav class="nav">
                <button id="prev-btn" aria-label="Previous frame">
                    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <button id="random-btn" aria-label="Random frame">
                    <svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
                </button>
                <button id="download-btn" aria-label="Download frame">
                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </button>
                <button class="solid" id="next-btn" aria-label="Next frame">
                    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
            </nav>
        </div>
    </div>

    <script src="../../mobile/main.js"></script>
    <script>
        const frameLabel = document.getElementById('frame-label');
        const frameTotal = document.getElementById('frame-total-label');
        const edgeLabel = document.getElementById('edge-label');
        const edgeS = document.getElementById('edge-s');
        const edgeE = document.getElementById('edge-e');
        const origSetTimestamp = set_timestamp;
        set_timestamp = function () {
            origSetTimestamp();
            if (global_frame != null && seasons[global_season] && seasons[global_season].episodes[global_episode]) {
                frameLabel.textContent = global_frame;
                frameTotal.textContent = seasons[global_season].episodes[global_episode].frames;
                edgeLabel.textContent = String(global_frame).padStart(6, '0');
                edgeS.textContent = global_season;
                edgeE.textContent = global_episode;
            }
        };
    </script>
</body>
</html>
