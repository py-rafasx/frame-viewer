<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Noturna — Desktop</title>
    <link rel="icon" href="../../static/chibi-frieren.jpeg">
    <style>
        :root {
            --wall: #131214;
            --panel: #1b191d;
            --panel-2: #201e23;
            --ink: #e9e4da;
            --muted: #8a8378;
            --line: #2a272d;
            --line-strong: #3a363d;
            --brass: #c9a45c;
            --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
            --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--sans); color: var(--ink);
            min-height: 100vh;
            background:
                radial-gradient(1000px 500px at 85% -10%, rgba(201,164,92,0.06), transparent 60%),
                var(--wall);
            display: flex; flex-direction: column; align-items: center;
        }
        body::before {
            content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background: url('../../static/fundo.jpg') center/cover no-repeat;
            opacity: .10; filter: blur(16px) brightness(.6);
        }

        .back-link {
            position: fixed; top: 14px; left: 16px; z-index: 60;
            font-size: 12.5px; color: var(--muted); text-decoration: none; font-weight: 600;
            background: rgba(27,25,29,0.85); border: 1px solid var(--line);
            border-radius: 30px; padding: 6px 14px; backdrop-filter: blur(8px);
            transition: color .2s, border-color .2s;
        }
        .back-link:hover { color: var(--brass); border-color: var(--brass); }

        .topbar {
            position: sticky; top: 0; z-index: 50; width: 100%;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 14px max(18px, calc((100vw - 1120px) / 2));
            background: rgba(19,18,20,0.82); backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
        }
        .brand { display: flex; align-items: baseline; gap: 12px; }
        .brand .wordmark { font-family: var(--serif); font-size: 23px; font-weight: 600; letter-spacing: .2px; }
        .brand .wordmark i { font-style: normal; color: var(--brass); }
        .brand .sub { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 3.5px; }
        .top-actions { display: flex; gap: 8px; }
        .top-actions select {
            appearance: none; -webkit-appearance: none;
            font-family: inherit; font-size: 13px; font-weight: 600; color: var(--ink);
            background: var(--panel) url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238a8378' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right 12px center;
            border: 1px solid var(--line-strong); border-radius: 4px;
            padding: 9px 32px 9px 14px; cursor: pointer; min-width: 120px;
            transition: border-color .2s;
        }
        .top-actions select:hover { border-color: var(--brass); }
        .top-actions select:focus-visible { outline: none; border-color: var(--brass); box-shadow: 0 0 0 3px rgba(201,164,92,0.15); }

        .shell { width: 100%; max-width: 1120px; padding: 30px 18px 40px; display: flex; flex-direction: column; gap: 16px; }

        /* ---- wall label (like a museum plaque) ---- */
        .plaque { text-align: center; font-family: var(--serif); font-size: 13px; letter-spacing: 2.5px; color: var(--muted); text-transform: uppercase; }
        .plaque b { color: var(--brass); font-weight: 600; }

        .mat {
            background: var(--panel); border: 1px solid var(--line);
            padding: clamp(14px, 3vw, 34px);
            box-shadow: 0 24px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
        }
        .stage {
            position: relative; aspect-ratio: 16/9; background: #07070a;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .stage img { width: 100%; height: 100%; object-fit: contain; }
        #err-msg-view {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 76%; max-width: 360px; display: none;
            background: #221d16; border: 1px solid #4a3f2a; border-radius: 4px;
            padding: 18px; text-align: center; color: #e0b36a; font-weight: 600; z-index: 3;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
        }
        .spinner {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 42px; height: 42px; border: 3px solid rgba(255,255,255,0.14);
            border-top-color: var(--brass); border-radius: 50%;
            animation: spin .9s linear infinite; z-index: 2; display: none;
        }
        @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

        .caption {
            display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px; align-items: end;
            padding: 14px 6px 0;
        }
        .caption .cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
        .caption .cell.mid { text-align: center; }
        .caption .cell.right { text-align: right; align-items: flex-end; }
        .kicker { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; color: var(--muted); }
        .caption .big { font-family: var(--serif); font-size: clamp(30px, 4.5vw, 44px); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
        .caption .big small { font-size: .5em; font-weight: 400; color: var(--muted); margin-left: 6px; }
        .caption .ep { font-family: var(--serif); font-size: 17px; color: var(--brass); font-style: italic; }
        .caption .ts { font-family: var(--serif); font-size: 19px; font-variant-numeric: tabular-nums; color: var(--muted); }

        .deck {
            background: var(--panel); border: 1px solid var(--line);
            padding: 16px 20px 14px; display: flex; flex-direction: column; gap: 14px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }
        .progress-row { display: flex; align-items: center; gap: 14px; }
        .progress-row time { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; min-width: 84px; }
        .progress-row time:first-child { text-align: right; }
        #progress-bar {
            flex: 1; height: 3px; border-radius: 2px; background: var(--line-strong);
            -webkit-appearance: none; appearance: none; outline: none; cursor: pointer;
        }
        #progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
            background: var(--brass); border: 7px solid var(--panel-2); margin-top: -9.5px;
            box-shadow: 0 0 0 1px var(--line-strong), 0 3px 10px rgba(0,0,0,0.4);
            transition: transform .15s;
        }
        #progress-bar::-webkit-slider-thumb:hover { transform: scale(1.12); }
        #progress-bar::-moz-range-thumb {
            width: 8px; height: 22px; border: none; border-radius: 3px; background: var(--brass);
            border: 7px solid var(--panel-2); box-shadow: 0 0 0 1px var(--line-strong), 0 3px 10px rgba(0,0,0,0.4);
        }
        #progress-bar::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: var(--line-strong); }
        #progress-bar::-moz-range-track { height: 3px; border-radius: 2px; background: var(--line-strong); border: none; }

        .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .toolbar .group { display: flex; align-items: center; gap: 8px; }
        .toolbar .divider { width: 1px; height: 26px; background: var(--line-strong); margin: 0 4px; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px; height: 40px;
            padding: 0 18px; border-radius: 30px; border: 1px solid var(--line-strong);
            background: transparent; color: var(--ink); cursor: pointer;
            font-size: 13px; font-weight: 600; font-family: inherit;
            transition: transform .15s, border-color .2s, background .2s;
        }
        .btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .btn:hover { border-color: var(--brass); color: var(--brass); transform: translateY(-1px); }
        .btn.solid { background: var(--brass); border-color: var(--brass); color: #1d1509; font-weight: 700; }
        .btn.solid:hover { background: #d8b46e; color: #1d1509; }
        .btn.icon { padding: 0; width: 40px; justify-content: center; }
        .jump { display: flex; align-items: center; gap: 8px; }
        .jump label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.6px; font-weight: 700; }
        #frame-input {
            width: 76px; height: 40px; text-align: center; border: none; border-bottom: 1.5px solid var(--line-strong);
            background: transparent; color: var(--ink); font-size: 15px; font-weight: 700; outline: none;
            font-family: var(--serif); border-radius: 0; font-variant-numeric: tabular-nums;
        }
        #frame-input:focus { border-bottom-color: var(--brass); }
        #frame-input::-webkit-inner-spin-button, #frame-input::-webkit-outer-spin-button { -webkit-appearance: none; }
        #timestamp-input {
            width: 120px; height: 40px; border: none; background: transparent; outline: none;
            text-align: center; color: var(--muted); font-size: 13.5px; font-weight: 600; cursor: default;
            font-family: inherit; font-variant-numeric: tabular-nums;
        }
        .hint { text-align: center; font-size: 11.5px; color: var(--muted); letter-spacing: .3px; }

        @media (max-width: 720px) {
            .caption { grid-template-columns: 1fr 1fr; }
            .caption .cell.mid { display: none; }
            .toolbar { justify-content: center; }
            .brand .sub { display: none; }
        }
    </style>
</head>
<body>
    <a class="back-link" href="../index.html">← Alternativas</a>

    <header class="topbar">
        <div class="brand">
            <span class="wordmark">Frieren<i>.Frames</i></span>
            <span class="sub">Galerie Nocturne</span>
        </div>
        <div class="top-actions">
            <select id="season-list"><option value="" disabled selected>Season</option></select>
            <select id="episode-list"><option value="" disabled selected>Episode</option></select>
        </div>
    </header>

    <main class="shell">
        <p class="plaque"><b id="plaque-label">—</b> &nbsp;·&nbsp; Arquivo de Quadros</p>

        <figure class="mat">
            <div class="stage">
                <img id="current-image" src="" alt="Frame">
                <div id="err-msg-view"></div>
                <div class="spinner"></div>
            </div>
        </figure>

        <div class="caption">
            <div class="cell">
                <span class="kicker">Quadro</span>
                <span class="big"><span id="frame-label">—</span><small id="frame-total-label">/ —</small></span>
            </div>
            <div class="cell mid">
                <span class="kicker">Obra</span>
                <span class="ep" id="ep-label">—</span>
            </div>
            <div class="cell right">
                <span class="kicker">Tempo</span>
                <span class="ts" id="time-label">0:00:00.00</span>
            </div>
        </div>

        <section class="deck">
            <div class="progress-row">
                <time id="current-time">0:00:00.00</time>
                <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.01">
                <time id="total-time">0:00:00.00</time>
            </div>
            <div class="toolbar">
                <div class="group">
                    <button class="btn icon" id="prev-btn" aria-label="Previous frame">
                        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <button class="btn" id="random-btn">Random</button>
                </div>
                <div class="divider" aria-hidden="true"></div>
                <div class="group">
                    <div class="jump">
                        <label for="frame-input">Frame</label>
                        <input type="number" id="frame-input" placeholder="1234" data-min="1">
                    </div>
                </div>
                <div class="divider" aria-hidden="true"></div>
                <div class="group">
                    <input type="text" id="timestamp-input" value="0:00:00.00" readonly>
                    <button class="btn" id="download-btn">
                        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Download
                    </button>
                    <button class="btn solid" id="next-btn">
                        Next
                        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script src="../../desktop/main.js"></script>
    <script>
        const frameLabel = document.getElementById('frame-label');
        const frameTotal = document.getElementById('frame-total-label');
        const epLabel = document.getElementById('ep-label');
        const timeLabel = document.getElementById('time-label');
        const plaque = document.getElementById('plaque-label');
        const origSetTimestamp = set_timestamp;
        set_timestamp = function () {
            origSetTimestamp();
            const tsInput = document.getElementById('timestamp-input');
            if (tsInput) timeLabel.textContent = tsInput.value;
            if (global_frame != null && seasons[global_season] && seasons[global_season].episodes[global_episode]) {
                frameLabel.textContent = global_frame;
                frameTotal.textContent = '/ ' + seasons[global_season].episodes[global_episode].frames;
                epLabel.textContent = seasons[global_season].name + ' — ' + seasons[global_season].episodes[global_episode].name;
                plaque.textContent = seasons[global_season].name + ' · ' + seasons[global_season].episodes[global_episode].name;
            }
        };
    </script>
</body>
</html>
