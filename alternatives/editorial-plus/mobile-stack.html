<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Editorial+ Mobile — Stack</title>
    <link rel="icon" href="../../static/chibi-frieren.jpeg">
    <style>
        :root {
            --paper: #faf9f6;
            --paper-deep: #f2f0eb;
            --ink: #1d1c19;
            --muted: #8b857a;
            --line: #e7e3da;
            --line-strong: #d5d0c4;
            --black: #1d1c19;
            --serif: Georgia, 'Times New Roman', serif;
            --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: var(--sans); color: var(--ink);
            height: 100dvh; overflow: hidden; position: fixed; inset: 0;
            background: var(--paper);
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none; user-select: none;
            -webkit-text-size-adjust: 100%;
        }

        .app {
            height: 100%; display: flex; flex-direction: column; gap: 10px;
            padding: calc(10px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));
            justify-content: center;
        }

        /* ---- topbar ---- */
        .top { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .wordmark { font-family: var(--serif); font-size: 16px; font-weight: 700; letter-spacing: -.2px; flex: 1; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .wordmark i { font-style: normal; color: var(--muted); }
        .top select {
            appearance: none; -webkit-appearance: none; font-family: inherit;
            font-size: 12px; font-weight: 600; color: var(--ink);
            background: var(--paper-deep) url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238b857a' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right 8px center;
            border: 1px solid var(--line-strong); border-radius: 30px;
            padding: 7px 22px 7px 10px; cursor: pointer; max-width: 34%; min-width: 0;
        }
        select:focus { outline: none; border-color: var(--black); }

        /* ---- imagem 16:9 ---- */
        .image-zone {
            flex: 0 0 auto; aspect-ratio: 16 / 9; width: 100%;
            position: relative;
            display: flex; align-items: center; justify-content: center;
            background: var(--paper-deep); border-radius: 4px;
            overflow: hidden;
        }
        #current-image { width: 100%; height: 100%; object-fit: contain; display: block; border-radius: 4px; }
        #err-msg-view {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 80%; max-width: 320px; display: none;
            background: #fffdf8; border: 1px solid var(--line-strong); border-radius: 4px;
            padding: 15px; text-align: center; color: #a01c1c; font-weight: 600; font-size: 13px; z-index: 3;
            box-shadow: 0 14px 36px rgba(0,0,0,0.2);
        }
        .spinner {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 36px; height: 36px; border: 3px solid rgba(29,28,25,0.12);
            border-top-color: var(--ink); border-radius: 50%;
            animation: spin .9s linear infinite; z-index: 2; display: none;
        }
        @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

        /* ---- bottom: legenda + controles ---- */
        .bottom { flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }

        .legend {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: 12px 2px 0; border-top: 1px solid var(--line);
        }
        .cap-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .kicker { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 2.2px; color: var(--muted); }
        .big-row { display: flex; align-items: baseline; gap: 5px; }
        .big-row #frame-input {
            font-family: var(--serif); font-size: clamp(22px, 6.5vw, 30px); font-weight: 700; line-height: 1;
            font-variant-numeric: tabular-nums; letter-spacing: -.4px;
            width: 4.5ch; min-width: 0; text-align: center;
            background: transparent; border: none; border-bottom: 1.5px solid transparent;
            color: var(--ink); outline: none; padding: 4px 2px; border-radius: 0;
            -moz-appearance: textfield; appearance: textfield;
        }
        .big-row #frame-input:focus { border-bottom-color: var(--ink); }
        .big-row #frame-input::-webkit-inner-spin-button, .big-row #frame-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .big-row small { font-size: .55em; font-weight: 400; color: var(--muted); margin-left: 1px; white-space: nowrap; }
        .cap-right { display: flex; align-items: center; }
        .cap-right .ts {
            font-family: var(--serif); font-size: 13px; font-weight: 600; color: var(--ink);
            font-variant-numeric: tabular-nums; background: #fff; border: 1px solid var(--line-strong);
            border-radius: 30px; height: 36px; display: inline-flex; align-items: center; padding: 0 14px;
        }

        /* ---- progress ---- */
        .progress-card {
            flex-shrink: 0; background: var(--paper-deep); border: 1px solid var(--line);
            border-radius: 30px; padding: 9px 14px 7px; display: flex; flex-direction: column; gap: 3px;
        }
        .time-row { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
        #progress-bar {
            width: 100%; height: 3px; border-radius: 2px; background: var(--line-strong);
            -webkit-appearance: none; appearance: none; outline: none; cursor: pointer; touch-action: manipulation;
        }
        #progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
            background: var(--black); border: 3px solid #fff; margin-top: -8px;
            box-shadow: 0 0 0 1px var(--line-strong), 0 2px 6px rgba(0,0,0,0.15);
        }
        #progress-bar::-moz-range-thumb {
            width: 13px; height: 13px; border: 3px solid #fff; border-radius: 50%;
            background: var(--black); box-shadow: 0 0 0 1px var(--line-strong), 0 2px 6px rgba(0,0,0,0.15);
        }
        #progress-bar::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: var(--line-strong); }
        #progress-bar::-moz-range-track { height: 3px; border-radius: 2px; background: var(--line-strong); border: none; }

        /* ---- nav ---- */
        .nav { flex-shrink: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .nav button {
            -webkit-appearance: none; appearance: none; cursor: pointer;
            height: 52px; border-radius: 30px; border: 1px solid var(--line-strong);
            background: #fff; color: var(--ink);
            display: flex; align-items: center; justify-content: center;
            font-family: inherit; transition: transform .12s; min-width: 44px;
        }
        .nav button svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .nav button:active { transform: scale(0.94); }
        .nav button.solid { background: var(--black); border-color: var(--black); color: #f5f2ea; }
        .nav button.solid:active { background: #3a372f; }
    </style>
</head>
<body>
    <div class="app">
        <header class="top">
            <span class="wordmark">Frieren<i>.Frames</i></span>
            <select id="season-list"><option value="" disabled selected>Season</option></select>
            <select id="episode-list"><option value="" disabled selected>Episode</option></select>
        </header>

        <main class="image-zone">
            <img id="current-image" src="" alt="Frame">
            <div id="err-msg-view"></div>
            <div class="spinner"></div>
        </main>

        <div class="bottom">
            <section class="legend">
                <div class="cap-left">
                    <span class="kicker">Frame</span>
                    <div class="big-row">
                        <input type="number" id="frame-input" placeholder="1234" data-min="1" inputmode="numeric">
                        <small id="frame-total-label"> / —</small>
                    </div>
                </div>
                <div class="cap-right">
                    <span class="ts" id="timestamp-btn">0:00:00.00</span>
                </div>
            </section>

            <div class="progress-card">
                <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.01">
                <div class="time-row">
                    <span id="current-time">0:00:00.00</span>
                    <span id="total-time">0:00:00.00</span>
                </div>
            </div>

            <nav class="nav">
                <button class="solid" id="prev-btn" aria-label="Previous frame">
                    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <button id="random-btn" aria-label="Random frame">
                    <svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
                </button>
                <button id="download-btn" aria-label="Download frame">
                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </button>
                <button class="solid" id="next-btn" aria-label="Next frame">
                    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
            </nav>
        </div>
    </div>

    <script src="../../mobile/main.js"></script>
    <script>
        const frameTotal = document.getElementById('frame-total-label');
        const origSetTimestamp = set_timestamp;
        set_timestamp = function () {
            origSetTimestamp();
            if (global_frame != null && seasons[global_season] && seasons[global_season].episodes[global_episode]) {
                frameTotal.textContent = ' / ' + seasons[global_season].episodes[global_episode].frames;
            }
        };
    </script>
</body>
</html>
